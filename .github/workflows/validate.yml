name: Validate Veo nodes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile __init__.py client.py nodes.py
      - name: Check Registry ID and workflows
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          metadata = tomllib.loads(Path('pyproject.toml').read_text())
          assert metadata['project']['name'] == 'veo'
          assert metadata['tool']['comfy']['PublisherId'] == 'acedatacloud'
          for path in Path('examples').glob('*.json'):
              workflow = json.loads(path.read_text())
              assert workflow['nodes'] and workflow['links'] is not None
          PY
